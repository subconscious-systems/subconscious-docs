name: Notify workspace pin

# A push to main moves this repo's submodule pin on subconscious-workspace.

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  dispatch:
    name: Tell subconscious-workspace that main moved
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          # Fine-grained PAT with Contents: write on subconscious-workspace.
          # GITHUB_TOKEN cannot dispatch to another repository.
          GH_TOKEN: ${{ secrets.WORKSPACE_E2E_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WORKSPACE_E2E_DISPATCH_TOKEN is not set. The pin still moves on workflow_dispatch."
            exit 0
          fi
          gh api repos/subconscious-systems/subconscious-workspace/dispatches \
            -f event_type=docs-main \
            -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[repo]=subconscious-docs"
